name = "dh-lottery"
main = "dist-worker/index.js"
compatibility_date = "2024-11-01"

# Build worker + frontend before dev/deploy
[build]
command = "npm run build"

# Static assets: SPA fallback for /dingho handled in Worker
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# Durable Object for lottery state (in-memory, no database)
[[durable_objects.bindings]]
name = "LOTTERY"
class_name = "LotteryRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LotteryRoom"]
